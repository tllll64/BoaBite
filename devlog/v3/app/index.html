<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F2">
  <title>BoaBite</title>
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>

  <main class="phone">

    <!-- ================= 首页 ================= -->
    <section class="view view-home" id="viewHome">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 顶部品牌区：素材字标 + 素材图标（幽灵 / 帽子） -->
      <header class="brand">
        <img class="brand-wordmark" src="design/assets/hm-wordmark.png" alt="BoaBite">
        <div class="brand-actions">
          <button class="icon-btn" id="btnPersona" aria-label="蛇的人设">
            <img src="design/assets/hm-ghost-icon.png" alt="">
          </button>
          <button class="icon-btn" id="btnCalendar" aria-label="投喂日记">
            <img src="design/assets/hm-hat.png" alt="">
          </button>
        </div>
      </header>

      <!-- 蛇的说话气泡（框 + 左上角眼睛点缀素材叠加） -->
      <div class="bubble-wrap">
        <div class="hm-bubble">
          <img class="hm-bubble-eyes" src="design/assets/bubble-eyes.png" alt="">
          <img src="design/assets/bubble-frame.png" alt="" class="hm-bubble-bg">
          <span class="bubble-text" id="bubbleText"></span>
        </div>
      </div>

      <!-- 蛇形态区（页面主体） -->
      <section class="snake-stage">
        <div class="snake-holder" id="snakeHolder"></div>
      </section>

      <!-- 日期标签 + 数据栏（未投喂时隐藏） -->
      <section class="today" id="todayPanel">
        <div class="date-pill" id="datePill"></div>
        <div class="stat-card">
          <div class="stat">
            <b id="feedCount">0</b><span>次投喂</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <b id="feedKcal">0</b><span>累计 kcal</span>
          </div>
        </div>
      </section>

      <!-- 投喂按钮 -->
      <button class="feed-btn" id="feedBtn">🖐 我要投喂</button>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 相机拍摄页（节点 1→2） ================= -->
    <section class="view view-camera" id="viewCamera">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <video class="cam-video" id="camVideo" autoplay playsinline muted></video>

      <!-- 无摄像头画面时的演示背景（正式环境被真实取景覆盖） -->
      <img class="cam-demo-bg" src="design/assets/cam-demo-food.png" alt="">

      <!-- 快门后的照片层：与取景同位同尺寸，呼吸动画 -->
      <img class="cam-shot" id="camShot" alt="" hidden>

      <!-- 蛇嘴取景框 overlay -->
      <div class="cam-overlay">
        <img src="design/assets/snake-mouth.png" alt="蛇嘴取景框">
      </div>

      <!-- 顶部固定气泡 -->
      <div class="cam-bubble">
        <img src="design/assets/bubble.png" alt="" class="bubble-bg">
        <span>喂我嘴里就好～</span>
      </div>

      <!-- 底部操作栏 -->
      <footer class="cam-bar">
        <button class="cam-act" id="camClose" aria-label="取消">
          <img src="design/assets/icon-close.png" alt="">
        </button>
        <button class="cam-shutter" id="camShutter" aria-label="拍摄">
          <img src="design/assets/shutter.png" alt="">
        </button>
        <button class="cam-act" id="camAlbum" aria-label="相册">
          <img src="design/assets/icon-album.png" alt="">
        </button>
      </footer>

          <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 照片确认页（节点 3） ================= -->
    <section class="view view-confirm" id="viewConfirm">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <!-- 照片层：与相机页同位同尺寸（card/full），圆形裁切 -->
      <img class="cf-photo-layer card" id="cfPhotoLayer" alt="蛇嘴里的食物">

      <!-- 蛇衔圆环：与相机页蛇嘴 overlay 同构（原位变化） -->
      <div class="cf-ring-wrap">
        <img class="cf-ring" src="design/assets/snake-ring.png" alt="">
      </div>

      <!-- 底部白色操作区：↺ 重拍 / ✓ 确认 -->
      <footer class="cf-bottom">
        <button class="cf-retry" id="cfRetake" aria-label="重拍">
          <img src="design/assets/icon-retry.png" alt="">
        </button>
        <button class="cf-ok" id="cfConfirm" aria-label="确认投喂">
          <img src="design/assets/btn-confirm.png" alt="">
        </button>
        <span class="cf-ghost"></span>
      </footer>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>


    <!-- ================= 投食状页（点✓后 · 节点 7a） ================= -->
    <section class="view view-pledge" id="viewPledge">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <!-- 顶部气泡：投食状 -->
      <div class="rs-bubble">
        <img src="design/assets/bubble.png" alt="" class="bubble-bg">
        <span>蛇嘴吐不出美食，请立下投食状</span>
      </div>

      <!-- 照片层 + 蛇衔圆环：与确认页同构原位 -->
      <img class="cf-photo-layer card" id="plPhotoLayer" alt="蛇嘴里的食物">
      <div class="cf-ring-wrap">
        <img class="cf-ring" src="design/assets/snake-ring.png" alt="">
      </div>

      <div class="rs-body">
        <p class="rs-lead">因以下原因，本人自愿投喂</p>
        <div class="rs-input-box">
          <textarea id="plReason" rows="3" placeholder="买多了吃不下"></textarea>
        </div>

        <div class="rs-actions">
          <button class="rs-btn rs-btn-ghost" id="plRegret">反悔了</button>
          <button class="rs-btn rs-btn-dark" id="plFeed">马上喂</button>
        </div>
      </div>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 品鉴加载动画页（马上喂后 · r1） ================= -->
    <section class="view view-eatload" id="viewEatLoad">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <div class="el-box">
        <div class="el-canvas" id="elCanvas">
          <!-- 蛇吞食物动画（程序绘制原型）：食物掉进蛇嘴，蛇身鼓包 -->
        </div>
        <p class="el-text">品鉴美食中...</p>
      </div>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 品鉴结果页（r2） ================= -->
    <section class="view view-result" id="viewResult">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <!-- 右上角分享按钮 -->
      <button class="share-btn" id="btnShare" aria-label="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V4M12 4l-4 4M12 4l4 4"/>
          <path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
        </svg>
      </button>

      <!-- 蛇插画区：横趴蛇 + 腹中食物 -->
      <div class="tk-snake" id="tkSnake"></div>

      <!-- 蛇嘴表情图标 -->
      <div class="tk-face" id="tkFace">
        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <g class="tk-face-happy">
            <circle cx="21" cy="24" r="3.2" fill="#1f1f1f"/>
            <circle cx="39" cy="24" r="3.2" fill="#1f1f1f"/>
            <rect x="20" y="34" width="20" height="10" rx="4" fill="#1f1f1f"/>
            <path d="M24 36.5 v5 M30 36.5 v5 M36 36.5 v5" stroke="#fff" stroke-width="1.6"/>
          </g>
          <g class="tk-face-stuffed" style="display:none">
            <path d="M17.5 22 l7 7 M24.5 22 l-7 7" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
            <path d="M35.5 22 l7 7 M42.5 22 l-7 7" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
            <rect x="19" y="35" width="22" height="11" rx="5" fill="#1f1f1f"/>
            <path d="M24 37.5 v6 M29.5 37.5 v6 M35 37.5 v6 M40.5 37.5 v6" stroke="#fff" stroke-width="1.6"/>
          </g>
        </svg>
      </div>

      <!-- 白色卡片区 -->
      <div class="tk-card">
        <div class="tk-title"><i>◇</i><b>品鉴感言</b><i>——◇</i></div>
        <div class="tk-review">
          <span id="tkReview"></span>
          <div class="tk-sticker" id="tkSticker"></div>
        </div>
        <div class="tk-stats">
          <div class="tk-stat">
            <span class="tk-label">消化热量</span>
            <div class="tk-value"><b id="tkKcal"></b><em>kcal</em></div>
          </div>
          <div class="tk-divider"></div>
          <div class="tk-stat">
            <span class="tk-label">相当于吃下</span>
            <div class="tk-value"><span class="tk-emoji">🐰</span><b id="tkEq"></b></div>
          </div>
        </div>
        <div class="tk-actions">
          <button class="rs-btn rs-btn-ghost" id="tkDone">喂完了</button>
          <button class="rs-btn rs-btn-dark" id="tkMore">继续喂</button>
        </div>
      </div>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- 轻提示 -->
    <div class="toast" id="toast"></div>

  </main>

  <!-- PRD 侧栏（宽屏工作台模式显示；内容实时读取 PRD.md） -->
  <aside class="prd-panel" id="prdPanel">
    <header class="prd-head">
      <span class="prd-title">📄 PRD</span>
      <span class="prd-hint">要改哪里，直接在聊天里说</span>
    </header>
    <div class="md" id="prdContent"><p>PRD 加载中…</p></div>
  </aside>

  <!-- 隐藏的文件选择（相册 / 降级拍摄） -->
  <input type="file" id="albumInput" accept="image/*" hidden>
  <input type="file" id="takeInput" accept="image/*" capture="environment" hidden>

  <script src="app.js?v=13"></script>
  <script src="prd.js?v=3"></script>
</body>
</html>
