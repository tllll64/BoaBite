<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%238FD694'/%3E%3Ccircle cx='38' cy='44' r='7' fill='%232b2b2b'/%3E%3Ccircle cx='62' cy='44' r='7' fill='%232b2b2b'/%3E%3Cpath d='M35 60 q15 14 30 0' stroke='%232b2b2b' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>BoaBite</title>
  <link rel="stylesheet" href="style.css?v=52">
</head>
<body>

  <main class="phone">

    <!-- ================= 首页（V3 设计稿 · node 1199:2246） ================= -->
    <section class="view view-home" id="viewHome">

      <!-- 整屏背景图 -->
      <div class="hm-bg">
        <img src="design/assets/v3/imgBackground1.png" alt="">
      </div>

      <!-- 状态栏（设计稿：8:00 + 信号/连接/电量 SVG） -->
      <div class="hm-status">
        <span class="hm-time">8:00</span>
        <span class="hm-signal"><img src="design/assets/v3/imgSignal.svg" alt=""></span>
        <span class="hm-conn"><img src="design/assets/v3/imgConnection.svg" alt=""></span>
        <span class="hm-batt"><img src="design/assets/v3/imgBattery.svg" alt=""></span>
      </div>

      <!-- 顶部品牌区：BoaBite 文字标 + 两个图标按钮 -->
      <header class="hm-brand">
        <img class="hm-logo" src="design/assets/home-logo.png" alt="BoaBite">
        <div class="hm-actions">
          <button class="hm-icon-btn" id="btnPersona" aria-label="蛇的人设">
            <img src="design/assets/v3/imgFrame2147225874.svg" alt="">
          </button>
          <button class="hm-icon-btn" id="btnCalendar" aria-label="投喂日记">
            <img src="design/assets/v3/imgFrame2147225873.svg" alt="">
          </button>
        </div>
      </header>

      <!-- 蛇的说话气泡（素材底图 + 眼睛点缀 + 前端文字） -->
      <div class="hm-bubble">
        <img class="hm-bubble-bg" src="design/assets/v3/imgVector59.svg" alt="">
        <img class="hm-bubble-die" src="design/assets/die.png" alt="">
        <span class="hm-bubble-text" id="bubbleText">太饿了，你不吃的可以给我喂点</span>
      </div>

      <!-- 蛇形态区：设计稿 Group 26 整体素材（蛇身 + 颤抖线 + 口水 + 面部细节，一体导出） -->
      <div class="hm-snake" id="snakeHolder">
        <img class="hs-whole" src="design/assets/v3/snake.png" srcset="design/assets/v3/snake@2x.png 2x" alt="蛇">
      </div>

      <!-- 投喂按钮 -->
      <button class="hm-feed" id="feedBtn" aria-label="我要投喂">
        <img src="design/assets/home-feed.png" alt="我要投喂">
      </button>

      <div class="hm-homebar"></div>
    </section>

    <!-- ================= 相机拍摄页（节点 1→2） ================= -->
    <section class="view view-camera" id="viewCamera">
      <img class="statusbar" src="design/assets/camera-statusbar-white.png" alt="">

      <video class="cam-video" id="camVideo" autoplay playsinline muted></video>

      <!-- 快门后的照片层：与取景同位同尺寸，静态定格 -->
      <img class="cam-shot" id="camShot" alt="" hidden>
      <div class="analysis-dots" aria-hidden="true"><div class="analysis-scan"></div></div>
      <div class="analysis-paper" aria-hidden="true">
        <img src="design/assets/paper-bg.png" alt="">
        <img src="design/assets/paper-bg.png" alt="">
        <img src="design/assets/paper-bg.png" alt="">
      </div>
      <img class="analysis-yellow" src="design/assets/snake-ring.png" alt="">
      <img class="analysis-subject" id="analysisSubject" alt="">

      <!-- 蛇嘴取景框 overlay -->
      <div class="cam-overlay">
        <img src="design/assets/camera-mouth.png" alt="蛇嘴取景框">
      </div>

      <!-- 顶部固定气泡 -->
      <div class="cam-bubble">
        <img src="design/assets/camera-bubble.png" alt="" class="bubble-bg">
        <span>喂我嘴里就好～</span>
      </div>

      <!-- 底部操作栏 -->
      <footer class="cam-bar">
        <button class="cam-act" id="camClose" aria-label="取消">
          <img src="design/assets/icon-close.png" alt="">
        </button>
        <button class="cam-shutter" id="camShutter" aria-label="拍摄">
          <img src="design/assets/shutter.png" alt="">
        </button>
        <button class="cam-act" id="camAlbum" aria-label="相册">
          <img src="design/assets/icon-album.png" alt="">
        </button>
      </footer>

          <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 照片确认页（节点 3） ================= -->
    <section class="view view-confirm" id="viewConfirm">
      <div class="cf-name-bubble">
        <img src="design/assets/camera-bubble.png" alt="">
        <input id="cfFoodName" type="text" maxlength="40" aria-label="物体名称，可编辑" placeholder="请输入物体名称" autocomplete="off" enterkeyhint="done">
      </div>
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <!-- 照片层：与相机页同位同尺寸（card/full），圆形裁切 -->
      <img class="cf-photo-layer card" id="cfPhotoLayer" alt="蛇嘴里的食物">

      <!-- 蛇衔圆环：与相机页蛇嘴 overlay 同构（原位变化） -->
      <div class="cf-ring-wrap">
        <img class="cf-ring" src="design/assets/snake-ring.png" alt="">
      </div>

      <!-- 底部白色操作区：↺ 重拍 / ✓ 确认 -->
      <footer class="cf-bottom">
        <button class="cf-retry" id="cfRetake" aria-label="重拍">
          <img src="design/assets/icon-retry.png" alt="">
        </button>
        <button class="cf-ok" id="cfConfirm" aria-label="确认投喂">
          <img src="design/assets/btn-confirm.png" alt="">
        </button>
        <span class="cf-ghost"></span>
      </footer>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>


    <!-- ================= 投食状页（点✓后 · 节点 7a） ================= -->
    <section class="view view-pledge" id="viewPledge">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <!-- 顶部气泡：投食状 -->
      <div class="rs-bubble">
        <img src="design/assets/pledge-bubble.png" alt="" class="bubble-bg">
        <span>蛇嘴吐不出美食，请立下投食状</span>
      </div>

      <!-- 照片层 + 蛇衔圆环：与确认页同构原位 -->
      <img class="cf-photo-layer card" id="plPhotoLayer" alt="蛇嘴里的食物">
      <div class="cf-ring-wrap">
        <img class="cf-ring" src="design/assets/pledge-snake.png" alt="">
      </div>

      <div class="rs-body">
        <p class="rs-lead">因以下原因，本人自愿投喂</p>
        <div class="rs-input-box">
          <textarea id="plReason" rows="3" placeholder="买多了吃不下"></textarea>
        </div>

        <div class="rs-actions">
          <button class="rs-btn rs-btn-ghost" id="plRegret" aria-label="反悔了"><img src="design/assets/pledge-regret.png" alt="反悔了"></button>
          <button class="rs-btn rs-btn-dark" id="plFeed" aria-label="马上喂"><img src="design/assets/pledge-feed.png" alt="马上喂"></button>
        </div>
      </div>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 品鉴加载动画页（马上喂后 · r1） ================= -->
    <section class="view view-eatload" id="viewEatLoad">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <button class="el-back" id="elBack" aria-label="返回投食状"><img src="design/assets/icon-back.png?v=2" alt="">
      </button>

      <div class="el-box">
        <div class="el-canvas" id="elCanvas">
          <img class="el-illustration" src="design/assets/taste-loading.png" alt="蛇抱着食物">
        </div>
        <p class="el-text">把它吞进肚子里...</p>
      </div>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- ================= 品鉴结果页（r2） ================= -->
    <section class="view view-result" id="viewResult">
      <img class="statusbar" src="design/assets/statusbar-full.png" alt="">

      <!-- 纸质纹理背景 -->
      <img class="cf-paper" src="design/assets/paper-bg.png" alt="">

      <button class="el-back" id="resultBack" aria-label="返回首页"><img src="design/assets/icon-back.png?v=2" alt="">
      </button>
      <button class="share-btn" id="btnShare" aria-label="分享"><img src="design/assets/result-share.png" alt=""></button>
      <div class="tk-snake" id="tkSnake">
        <svg viewBox="0 0 730 162" aria-label="平躺的蛇"><path d="M22 143 Q48 128 141 126 Q239 120 355 128 Q493 138 558 110 Q610 90 657 110 Q686 122 686 137 Q663 148 611 146 L22 146 Z" fill="#ffdb94" stroke="#000" stroke-width="5" stroke-linejoin="round"/><path d="M618 120 q10 12 21 5 M678 137 l-13 -6 q-10 4 0 10 M685 94 q-13 -17 -5 -27 q18 -11 24 7 q4 13 -19 20" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/></svg>
      </div>
      <img class="tk-face" id="tkFace" src="design/assets/result-face.png" alt="蛇的表情">
      <div class="tk-card">
        <div class="tk-handle" aria-hidden="true"></div>
        <div class="tk-review"><img src="design/assets/result-output.png" alt="品鉴感言"><p id="tkReview"></p></div>
        <div class="tk-stats">
          <div class="tk-stat"><span class="tk-label">约消化热量</span><div class="tk-value"><b id="tkKcal"></b><em>kcal</em></div></div>
          <div class="tk-stat"><span class="tk-label">相当于吃下</span><div class="tk-value"><span class="tk-emoji" id="tkAnimalEmoji"></span><b id="tkEq"></b></div></div>
        </div>
        <div class="tk-actions">
          <button class="rs-btn" id="tkDone" aria-label="喂完了"><img src="design/assets/result-done.png" alt="喂完了"></button>
          <button class="rs-btn" id="tkMore" aria-label="继续喂"><img src="design/assets/result-continue.png" alt="继续喂"></button>
        </div>
      </div>

      <img class="homebar" src="design/assets/home-indicator-black.png" alt="">
    </section>

    <!-- 轻提示 -->
    <div class="toast" id="toast"></div>

  </main>

  <!-- 隐藏的文件选择（相册 / 降级拍摄） -->
  <input type="file" id="albumInput" accept="image/*" hidden>
  <input type="file" id="takeInput" accept="image/*" capture="environment" hidden>

  <script src="app.js?v=31"></script>
</body>
</html>
